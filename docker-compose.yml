services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 2s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

  # `make up` sobe só o Postgres (para rodar a API com `go run`).
  # `make docker-up` sobe tudo, com a API em container.
  api:
    profiles: [app]
    build: .
    environment:
      HTTP_ADDR: ":8080"
      DB_DRIVER: postgres
      DATABASE_URL: postgres://app:app@postgres:5432/app?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
