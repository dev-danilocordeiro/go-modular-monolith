services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 2s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Keycloak em modo DEV (banco H2 embutido, HTTP). O realm "app" é importado
  # de deploy/keycloak/realm-app.json na subida. Console: http://localhost:8180 (admin/admin)
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # O "iss" dos tokens é sempre http://localhost:8180/... (o endereço que o
      # navegador e o curl usam). Chamadas de backchannel (JWKS) feitas por
      # http://keycloak:8080, de dentro do compose, continuam funcionando.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # A imagem não tem curl: usa o /dev/tcp do bash na porta de gerenciamento.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      retries: 30
      start_period: 10s

  # `make up` sobe Postgres + Keycloak (para rodar a API com `go run`).
  # `make docker-up` sobe tudo, com a API em container.
  api:
    profiles: [app]
    build: .
    environment:
      HTTP_ADDR: ":8080"
      DB_DRIVER: postgres
      DATABASE_URL: postgres://app:app@postgres:5432/app?sslmode=disable
      OIDC_ISSUER_URL: http://localhost:8180/realms/app
      OIDC_DISCOVERY_URL: http://keycloak:8080/realms/app
      OIDC_AUDIENCE: app-api
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

volumes:
  pgdata:
